<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIT-07 // SCAN</title>
<style>
  @font-face {
    font-family: 'sys';
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #050505;
    overflow: hidden;
  }

  body {
    font-family: 'Courier New', 'IBM Plex Mono', monospace;
    color: #c8d0c8;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* scanline / grain overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 50;
    mix-blend-mode: overlay;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
    z-index: 51;
  }

  .device {
    width: 420px;
    max-width: 92vw;
    background: linear-gradient(180deg, #0d0f0d 0%, #070807 100%);
    border: 1px solid #1c211c;
    border-radius: 6px;
    box-shadow:
      0 0 0 1px #000,
      0 30px 80px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.03);
    padding: 0;
    position: relative;
  }

  .device-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid #171b17;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .device-title {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: #6f7a6f;
  }
  .device-title b {
    color: #9fb59f;
    font-weight: 600;
  }

  .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3a4a3a;
    box-shadow: 0 0 6px #2c3a2c;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .led.active {
    background: #7fef8f;
    box-shadow: 0 0 10px #4ee06a, 0 0 20px #4ee06a55;
    animation: pulse 1.1s infinite;
  }
  .led.alert {
    background: #ef4f4f;
    box-shadow: 0 0 10px #ef4f4f, 0 0 22px #ef4f4f66;
    animation: pulse 0.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .screen {
    margin: 20px 22px;
    height: 220px;
    background: #020302;
    border: 1px solid #14181490;
    border-radius: 3px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
  }

  .screen-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(80,120,90,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,120,90,0.06) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.5;
  }

  .screen-content {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  .idle-glyph {
    font-size: 13px;
    color: #4a5a4a;
    letter-spacing: 0.08em;
    line-height: 1.8;
  }
  .idle-glyph .blink {
    animation: blink 1.6s steps(1) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .status-line {
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #8fa88f;
    min-height: 20px;
  }

  .status-line.glitch {
    color: #cf6a6a;
    animation: jitter 0.12s infinite;
  }
  @keyframes jitter {
    0% { transform: translate(0,0); }
    25% { transform: translate(-1px,1px); }
    50% { transform: translate(1px,-1px); }
    75% { transform: translate(-1px,-1px); }
    100% { transform: translate(0,0); }
  }

  .bar-track {
    margin-top: 14px;
    height: 3px;
    width: 100%;
    background: #14181490;
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3a5a3a, #7fef8f);
    transition: width 0.15s linear;
  }

  .result-title {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: #6f7a6f;
    margin-bottom: 10px;
  }

  .result-body {
    font-size: 15px;
    color: #cf6a6a;
    letter-spacing: 0.03em;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .result-sub {
    margin-top: 10px;
    font-size: 10px;
    color: #4a5a4a;
    letter-spacing: 0.1em;
  }

  .controls {
    padding: 16px 22px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .scan-btn {
    flex: 1;
    background: #101410;
    border: 1px solid #2a332a;
    color: #9fb59f;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.14em;
    padding: 13px 0;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    position: relative;
  }
  .scan-btn:hover:not(:disabled) {
    background: #161c16;
    border-color: #46593f;
    color: #c8e8c0;
  }
  .scan-btn:active:not(:disabled) {
    transform: translateY(1px);
  }
  .scan-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .footer-meta {
    padding: 0 22px 18px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: #384238;
  }

  .contact-wrap {
    padding: 0 22px 22px;
    border-top: 1px solid #171b17;
    padding-top: 14px;
  }

  .contact-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #0c0f0c;
    border: 1px solid #263226;
    color: #6f8f6f;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 11px 0;
    border-radius: 3px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .contact-btn:hover {
    background: #131a13;
    border-color: #3a4a3a;
    color: #9fef9f;
  }

  .flash {
    animation: flashwhite 0.15s;
  }
  @keyframes flashwhite {
    0% { background: #0d0f0d; }
    50% { background: #1a2418; }
    100% { background: #0d0f0d; }
  }

  /* Responsive tweaks for small screens (keeps original layout/behavior intact) */
  @media (max-width: 520px) {
    html, body { overflow: auto; }
    .device-header { padding: 12px 14px 10px; }
    .device-title { font-size: 11px; }
    .screen { margin: 14px 14px; height: calc(50vw); padding: 12px; }
    .screen-grid { background-size: 18px 18px; }
    .idle-glyph { font-size: 12px; }
    .status-line { font-size: 12px; }
    .result-body { font-size: 14px; }
    .controls { padding: 12px 14px 16px; }
    .scan-btn { padding: 11px 0; font-size: 13px; }
    .footer-meta { padding: 0 14px 12px; font-size: 9px; }
    .contact-wrap { padding: 0 14px 16px; }
    .contact-btn { font-size: 11px; padding: 10px 0; }
  }

  @media (max-width: 360px) {
    .device { border-radius: 4px; }
    .screen { height: calc(60vw); }
    .result-body { font-size: 13px; }
    .device-title { letter-spacing: 0.1em; }
  }
</style>
</head>
<body>

<div class="device" id="device">
  <div class="device-header">
    <div class="device-title"><b>UNIT-07</b> · security scanner</div>
    <div class="led" id="led"></div>
  </div>

  <div class="screen">
    <div class="screen-grid"></div>
    <div class="screen-content" id="screenContent">
      <div class="idle-glyph">
        awaiting input<span class="blink">_</span><br>
        no anomalies on record
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="scan-btn" id="scanBtn">initiate scan</button>
  </div>

  <div class="footer-meta">
    <span id="metaLeft">READY</span>
    <span id="metaRight">DEPTH 0.0m</span>
  </div>

  <div class="contact-wrap">
    <a class="contact-btn" href="https://t.me/B0000067" target="_blank" rel="noopener noreferrer">contact here for removal of compromise</a>
  </div>
</div>

<script>
  const btn = document.getElementById('scanBtn');
  const screenContent = document.getElementById('screenContent');
  const led = document.getElementById('led');
  const metaLeft = document.getElementById('metaLeft');
  const metaRight = document.getElementById('metaRight');
  const device = document.getElementById('device');

  let scanCount = 0;
  let running = false;

  const scanSteps = [
    'calibrating sensors',
    'scanning apps',
    'triangulating signal',
    'detecting compromise',
    'isolating source'
  ];

  function sleep(ms) {
    return new Promise(res => setTimeout(res, ms));
  }

  function setIdle() {
    screenContent.innerHTML = `
      <div class="idle-glyph">
        awaiting input<span class="blink">_</span><br>
        no anomalies on record
      </div>`;
    led.className = 'led';
    metaLeft.textContent = 'READY';
    metaRight.textContent = 'DEPTH 0.0m';
  }

  async function runScan() {
    if (running) return;
    running = true;
    btn.disabled = true;
    btn.textContent = 'scanning…';
    led.className = 'led active';
    metaLeft.textContent = 'ACTIVE';

    scanCount++;

    // processing screen
    screenContent.innerHTML = `
      <div>
        <div class="status-line" id="statusLine">processing scan…</div>
        <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      </div>`;

    const statusLine = document.getElementById('statusLine');
    const barFill = document.getElementById('barFill');

    let pct = 0;
    for (let i = 0; i < scanSteps.length; i++) {
      statusLine.textContent = scanSteps[i] + '…';
      metaRight.textContent = 'DEPTH ' + (1.2 + i * 0.7).toFixed(1) + 'm';
      const target = Math.round(((i + 1) / scanSteps.length) * 100);
      while (pct < target) {
        pct += 4;
        barFill.style.width = Math.min(pct, 100) + '%';
        await sleep(18);
      }
      await sleep(220);
    }

    // On the 3rd scan onward, things get a little wrong.
    const spooky = scanCount >= 3;

    if (spooky) {
      device.classList.add('flash');
      led.className = 'led alert';
      statusLine.classList.add('glitch');
      statusLine.textContent = 'signal source: unresolved';
      await sleep(450);
      device.classList.remove('flash');
    }

    await sleep(300);
    showResult(spooky);

    running = false;
    btn.disabled = false;
    btn.textContent = 'initiate scan';
  }

  function showResult(spooky) {
    led.className = spooky ? 'led alert' : 'led active';

    if (!spooky) {
      screenContent.innerHTML = `
        <div>
          <div class="result-title">SCAN COMPLETE</div>
          <div class="result-body">1 virus detected.\nsource: unsafe software.\nno further anomalies.</div>
          <div class="result-sub">confidence 98% · loc 0.0m from sensor</div>
        </div>`;
      metaLeft.textContent = 'IDLE';
      metaRight.textContent = 'DEPTH 0.0m';
      return;
    }

    // repeated "Hello" responses, each closer / stranger
    const stages = [
      { body: '7 virus detected.\nsource: unknown software.\nno further anomalies.', sub: 'confidence 100% · loc 0.0m from sensor' },
      { body: '10 virus detected.\nsource A: unknown software.\nsource B: unclassified.', sub: 'confidence 71% · loc 2.4m from sensor' },
      { body: 'hello', sub: 'confidence — · loc 2.4m from sensor' },
      { body: 'hello\nhello', sub: 'confidence — · loc 1.1m from sensor' },
      { body: 'hello\nhello\nhello', sub: 'confidence — · loc 0.3m from sensor · CLOSING' },
    ];

    const idx = Math.min(scanCount - 3, stages.length - 1);
    const stage = stages[idx];

    screenContent.innerHTML = `
      <div>
        <div class="result-title" style="color:#6f4a4a;">SCAN COMPLETE</div>
        <div class="result-body">${stage.body}</div>
        <div class="result-sub">${stage.sub}</div>
      </div>`;

    metaLeft.textContent = 'ALERT';
    metaRight.textContent = idx >= 2 ? 'DEPTH ' + stage.sub.split('loc ')[1].split(' ')[0] : 'DEPTH 2.4m';
  }

  btn.addEventListener('click', runScan);
</script>

</body>
</html>
